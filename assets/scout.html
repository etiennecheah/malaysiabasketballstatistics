<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>HoopStatsMY Scout Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
/* Layout: an editing room. Four panels that never move — clip bin (left), viewer (centre), inspector (right),
   one timeline across the bottom — so watching, marking, tagging and trimming happen in one place, in the
   order an editor or a Sportscode analyst works. The room is dark (the picture is what matters); the report
   is a page that follows the site's light or dark theme. Tokens are HoopStatsMY's own. */
:root{
  --bg: oklch(96.5% 0.006 250); --surface: oklch(100% 0 0); --surface-alt: oklch(95% 0.008 250);
  --border: oklch(88% 0.012 250); --hair: oklch(94% 0.007 255);
  --text: oklch(18% 0.015 255); --text-muted: oklch(46% 0.02 255); --text-faint: oklch(50.5% 0.016 255);
  --accent: oklch(46% 0.16 255); --accent-soft: oklch(94% 0.03 255); --accent-ink: oklch(44% 0.16 255);
  --ember: #d9762a; --ember-soft: oklch(95% 0.05 55); --ember-ink: oklch(47% 0.16 42);
  --positive: oklch(56% 0.14 148); --positive-ink: oklch(47% 0.13 148); --positive-soft: oklch(95% 0.03 148);
  --negative: oklch(56% 0.19 25); --negative-soft: oklch(95% 0.04 25);
  --on-bg: oklch(16% 0.012 255); --on-fg: #fff;
  --void: oklch(12.5% 0.018 262);
  --court: oklch(97.5% 0.006 70); --court-line: oklch(70% 0.02 255); --court-paint: oklch(93.5% 0.012 255);
  --shadow: 0 1px 2px oklch(20% 0.02 255 / .06); --shadow-3: 0 18px 50px oklch(12% 0.02 255/.28);
  --display: 'Archivo Narrow', 'Archivo', system-ui, sans-serif;
  --body: 'Archivo', system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg: oklch(17% 0.012 255); --surface: oklch(21% 0.012 255); --surface-alt: oklch(25% 0.012 255);
  --border: oklch(32% 0.012 255); --hair: oklch(25.5% 0.013 255);
  --text: oklch(95% 0.006 255); --text-muted: oklch(75% 0.012 255); --text-faint: oklch(71% 0.012 255);
  --accent: #4d93ea; --accent-soft: oklch(30% 0.06 255); --accent-ink: oklch(82% 0.1 255);
  --ember-soft: oklch(30% 0.06 55); --ember-ink: oklch(80% 0.13 60);
  --positive: oklch(70% 0.15 148); --positive-ink: oklch(78% 0.14 148); --positive-soft: oklch(30% 0.05 148);
  --negative: oklch(68% 0.17 25); --negative-soft: oklch(30% 0.06 25);
  --on-bg: oklch(92% 0.008 255); --on-fg: oklch(15% 0.012 255);
  --court: oklch(23% 0.014 255); --court-line: oklch(52% 0.02 255); --court-paint: oklch(26.5% 0.016 255);
  --shadow: 0 1px 2px rgba(0,0,0,.45); --shadow-3: 0 18px 50px rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"], :root.room{
  --bg: oklch(17% 0.012 255); --surface: oklch(21% 0.012 255); --surface-alt: oklch(25% 0.012 255);
  --border: oklch(32% 0.012 255); --hair: oklch(25.5% 0.013 255);
  --text: oklch(95% 0.006 255); --text-muted: oklch(75% 0.012 255); --text-faint: oklch(71% 0.012 255);
  --accent: #4d93ea; --accent-soft: oklch(30% 0.06 255); --accent-ink: oklch(82% 0.1 255);
  --ember-soft: oklch(30% 0.06 55); --ember-ink: oklch(80% 0.13 60);
  --positive: oklch(70% 0.15 148); --positive-ink: oklch(78% 0.14 148); --positive-soft: oklch(30% 0.05 148);
  --negative: oklch(68% 0.17 25); --negative-soft: oklch(30% 0.06 25);
  --on-bg: oklch(92% 0.008 255); --on-fg: oklch(15% 0.012 255);
  --court: oklch(23% 0.014 255); --court-line: oklch(52% 0.02 255); --court-paint: oklch(26.5% 0.016 255);
  --shadow: 0 1px 2px rgba(0,0,0,.45); --shadow-3: 0 18px 50px rgba(0,0,0,.6);
  color-scheme: dark; }
/* the editing room is a touch deeper than the site's dark theme, so the picture stands out */
:root.room{ --bg: oklch(14.5% 0.014 258); --surface: oklch(18.5% 0.014 258); --surface-alt: oklch(22.5% 0.014 258); --border: oklch(29% 0.014 258); --hair: oklch(23.5% 0.014 258); }

*{ box-sizing:border-box; }
html, body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--text); font-family:var(--body); font-size:13.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:var(--text); }
button{ background:none; border:none; cursor:pointer; padding:0; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
kbd{ font-family:var(--display); font-size:10px; font-weight:600; padding:0 4px; border-radius:3px; border:1px solid var(--border); color:var(--text-faint); line-height:1.5; }
.lbl{ font-family:var(--display); font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); }
svg.i{ width:16px; height:16px; fill:currentColor; flex:none; }

/* ---------- shell ---------- */
.app{ --tlh:266px; display:grid; grid-template-rows:52px minmax(0,1fr) var(--tlh, 266px); height:100%;
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
.top{ display:flex; align-items:center; gap:12px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--surface); min-width:0; }
.wordmark{ font-family:var(--display); font-weight:700; font-size:16px; color:var(--text); display:flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none; }
.wordmark .dot{ width:8px; height:8px; border-radius:2px; background:var(--ember); box-shadow:0 0 12px var(--ember); }
.vsep{ width:1px; height:22px; background:var(--border); flex:none; }
.game{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.gteam{ display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:15px; white-space:nowrap; min-width:0; flex:0 1 auto; max-width:220px; }
.gteam, .gscore{ flex-shrink:0; }
.gteam span.n{ overflow:hidden; text-overflow:ellipsis; }
.gscore{ font-family:var(--display); font-weight:700; font-size:16px; color:var(--text-muted); white-space:nowrap; }
.gmeta{ font-size:12px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 0; }
.ws{ display:inline-flex; padding:3px; gap:2px; border-radius:9px; background:var(--surface-alt); border:1px solid var(--border); flex:none; }
.ws button{ height:28px; padding:0 14px; border-radius:7px; font-family:var(--display); font-weight:600; font-size:13px; color:var(--text-muted); transition:background-color .18s, color .18s; }
.ws button.on{ background:var(--on-bg); color:var(--on-fg); }
.tact{ display:flex; align-items:center; gap:6px; flex:none; }
.btn{ height:30px; padding:0 12px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-family:var(--display); font-weight:600; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:border-color .15s, background-color .15s, transform .1s; }
.btn:hover{ border-color:var(--text-faint); }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.ember{ background:var(--ember); border-color:var(--ember); color:#fff; }
.btn.ghost{ border-color:transparent; background:transparent; color:var(--text-muted); }
.btn.ghost:hover{ background:var(--surface-alt); color:var(--text); }
.btn.icon{ width:30px; padding:0; justify-content:center; }
.btn.danger:hover{ border-color:var(--negative); color:var(--negative); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.sstate{ font-size:11.5px; color:var(--text-faint); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.sstate i{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); }
.sstate.ok i{ background:var(--positive); } .sstate.dirty i{ background:var(--ember); }
.menu{ position:fixed; z-index:50; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-3); padding:5px; animation:pop .14s var(--ease); }
@keyframes pop{ from{ opacity:0; transform:translateY(-4px); } }
.menu button{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 10px; border-radius:6px; font-size:13px; text-align:left; }
.menu button:hover{ background:var(--surface-alt); }
.menu hr{ border:0; border-top:1px solid var(--hair); margin:4px 2px; }

.main{ display:grid; grid-template-columns:var(--binw, 280px) minmax(0,1fr) var(--insw, 372px); min-height:0; }
.panel{ background:var(--surface); min-height:0; display:flex; flex-direction:column; }
.panel + .panel{ border-left:1px solid var(--border); }
.ph{ display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--hair); min-height:42px; }
.ph h2{ margin:0; font-family:var(--display); font-size:14px; font-weight:700; }
.count{ font-family:var(--display); font-size:11.5px; font-weight:600; color:var(--text-muted); background:var(--surface-alt); border-radius:100px; padding:0 7px; }
.grow{ flex:1; }
.scroll{ overflow:auto; min-height:0; flex:1; }

/* ---------- clip bin ---------- */
.binf{ display:flex; flex-direction:column; gap:6px; padding:8px 10px; border-bottom:1px solid var(--hair); }
.seg{ display:flex; padding:2px; gap:2px; border-radius:8px; background:var(--surface-alt); border:1px solid var(--border); }
.seg button{ flex:1; height:26px; border-radius:6px; font-size:12px; font-weight:600; color:var(--text-muted); display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; overflow:hidden; transition:background-color .15s, color .15s; }
.seg button.on{ background:var(--on-bg); color:var(--on-fg); }
.seg.team button.on{ background:var(--tc); color:var(--ti); }
.inp{ width:100%; height:30px; border:1px solid var(--border); background:var(--surface-alt); border-radius:7px; padding:0 9px; color:var(--text); font-size:12.5px; }
.inp:focus{ border-color:var(--accent); outline:none; }
select.inp{ padding-right:4px; }
.cl{ display:grid; grid-template-columns:64px minmax(0,1fr); gap:9px; padding:7px 10px; border-bottom:1px solid var(--hair); cursor:pointer; position:relative; transition:background-color .12s; }
.cl:hover{ background:var(--surface-alt); }
.cl.sel{ background:var(--accent-soft); }
.cl.sel::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
.cl.play::after{ content:""; position:absolute; right:8px; top:8px; width:7px; height:7px; border-radius:50%; background:var(--ember); animation:blink 1s infinite; }
@keyframes blink{ 50%{ opacity:.25; } }
.th{ width:64px; height:36px; border-radius:4px; background:var(--void) center/cover no-repeat; position:relative; overflow:hidden; }
.th b{ position:absolute; left:0; bottom:0; right:0; height:3px; }
.th em{ position:absolute; right:2px; bottom:5px; font-style:normal; font-family:var(--display); font-size:10px; font-weight:700; color:#fff; background:rgba(0,0,0,.6); padding:0 3px; border-radius:2px; }
.cm{ min-width:0; }
.c1{ display:flex; gap:6px; align-items:baseline; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; }
.c1 .t{ font-family:var(--display); color:var(--text-muted); font-weight:700; }
.c1 .p{ overflow:hidden; text-overflow:ellipsis; }
.c2{ display:flex; gap:4px; flex-wrap:nowrap; overflow:hidden; margin-top:3px; }
.c2 .tag{ flex:none; }
.tag{ font-size:10.5px; font-weight:600; padding:0 6px; border-radius:100px; background:var(--surface-alt); color:var(--text-muted); border:1px solid var(--hair); line-height:1.6; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }
.tag.good{ background:var(--positive-soft); color:var(--positive-ink); border-color:transparent; }
.tag.bad{ background:var(--negative-soft); color:var(--negative); border-color:transparent; }
.c3{ font-size:11px; color:var(--text-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.empty{ color:var(--text-faint); font-size:12.5px; padding:16px 12px; line-height:1.55; }

/* ---------- viewer ---------- */
.viewer{ background:var(--void); }
.screen{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#04060a; overflow:hidden; }
.screen video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
.drop{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center; color:#e9eef6;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.05), transparent 65%); transition:background .2s; }
.drop.over{ background:radial-gradient(ellipse at center, rgba(217,118,42,.22), transparent 70%); }
.drop h2{ margin:0; font-family:var(--display); font-size:22px; color:#fff; }
.drop p{ margin:0; color:#9aa6ba; font-size:13px; max-width:46ch; }
.drop .row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.vbtn{ height:36px; padding:0 15px; border-radius:8px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff; font-family:var(--display); font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.vbtn:hover{ background:rgba(255,255,255,.14); }
.vbtn.hot{ background:var(--ember); border-color:var(--ember); }
.hud{ position:absolute; left:10px; top:10px; display:flex; gap:6px; pointer-events:none; }
.hud span{ font-family:var(--display); font-weight:700; font-size:12px; padding:3px 8px; border-radius:5px; background:rgba(4,6,10,.7); color:#fff; }
.hud .rec{ background:#c0262f; } .hud .reel{ background:var(--ember); } .hud .rng{ background:rgba(217,118,42,.9); }
.flash{ position:absolute; inset:0; pointer-events:none; border:3px solid var(--ember); opacity:0; }
.flash.go{ animation:flash .6s ease-out; }
@keyframes flash{ 0%{ opacity:1; } 100%{ opacity:0; } }
.transport{ display:flex; align-items:center; gap:4px; padding:6px 10px; border-top:1px solid rgba(255,255,255,.06); color:#e9eef6; flex-wrap:wrap; }
.tb{ height:30px; min-width:30px; padding:0 8px; border-radius:6px; color:#dfe6f1; font-family:var(--display); font-weight:600; font-size:12px; display:inline-flex; align-items:center; justify-content:center; gap:5px; transition:background .12s; }
.tb:hover{ background:rgba(255,255,255,.09); }
.tb.play{ width:36px; height:36px; border-radius:100px; background:#fff; color:var(--void); }
.tb.set{ color:#ffc690; box-shadow:inset 0 0 0 1px var(--ember); }
.tb.ember{ background:var(--ember); color:#fff; }
.tb svg{ width:15px; height:15px; fill:currentColor; }
.tb kbd{ border-color:rgba(255,255,255,.2); color:rgba(255,255,255,.55); }
.tc{ font-family:var(--display); font-weight:700; font-size:16px; color:#fff; padding:0 8px; white-space:nowrap; }
.tc small{ color:#8d99ad; font-size:12px; font-weight:500; }
.spd{ display:inline-flex; padding:2px; border-radius:7px; background:rgba(255,255,255,.06); }
.spd button{ height:26px; padding:0 7px; border-radius:5px; color:#8d99ad; font-family:var(--display); font-weight:600; font-size:12px; }
.spd button.on{ background:rgba(255,255,255,.16); color:#fff; }
.tsep{ width:1px; height:20px; background:rgba(255,255,255,.12); margin:0 3px; }

/* ---------- inspector ---------- */
.ih{ display:flex; flex-direction:column; gap:2px; padding:10px 14px; border-bottom:1px solid var(--hair); }
.ih .k{ display:flex; align-items:center; gap:8px; }
.ih .k h2{ margin:0; font-family:var(--display); font-size:15px; font-weight:700; }
.pill{ font-size:11px; font-weight:700; padding:1px 8px; border-radius:100px; background:var(--ember-soft); color:var(--ember-ink); }
.pill.edit{ background:var(--accent-soft); color:var(--accent-ink); }
.ih .r{ font-family:var(--display); font-size:13px; color:var(--text-muted); }
.ih .r b{ color:var(--text); }
.form{ display:flex; flex-direction:column; }
.fs{ padding:11px 14px; border-bottom:1px solid var(--hair); display:flex; flex-direction:column; gap:8px; }
.fs > .lbl{ display:flex; align-items:center; gap:8px; }
.fs > .lbl em{ font-style:normal; text-transform:none; letter-spacing:0; font-family:var(--body); font-weight:600; font-size:12px; color:var(--text); margin-left:auto; max-width:65%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{ font-size:12px; font-weight:600; height:28px; padding:0 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
  display:inline-flex; align-items:center; gap:6px; transition:background-color .12s, color .12s, border-color .12s, transform .1s; white-space:nowrap; }
.chip:hover{ border-color:var(--text-faint); color:var(--text); }
.chip:active{ transform:scale(.96); }
.chip.on{ background:var(--on-bg); border-color:var(--on-bg); color:var(--on-fg); }
.chip kbd{ margin-left:2px; }
.chip.on kbd{ color:inherit; border-color:currentColor; opacity:.6; }
.chip .rd{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex:none; }
.chip.good .rd{ background:var(--positive); } .chip.bad .rd{ background:var(--negative); }
.chip.sm{ height:25px; padding:0 8px; font-size:11.5px; }
.grid3{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:5px; }
.grid3 .chip{ justify-content:flex-start; }
.grid3 .chip kbd{ margin-left:auto; }
.tbig{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.tbig button{ height:40px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:8px; padding:0 10px; font-family:var(--display); font-weight:700; font-size:14px; color:var(--text-muted); overflow:hidden; transition:background-color .15s, color .15s, border-color .15s; }
.tbig button span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tbig button.on{ background:var(--tc); border-color:var(--tc); color:var(--ti); }
.tbig kbd{ margin-left:auto; }
.tbig button.on kbd{ color:inherit; border-color:currentColor; opacity:.6; }
.jgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(52px, 1fr)); gap:5px; }
.jer{ height:42px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-family:var(--display); font-weight:700; font-size:14px; color:var(--text-muted); position:relative; overflow:hidden; transition:background-color .12s, border-color .12s, color .12s; }
.jer img{ width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--surface-alt); }
.jer.ph{ font-size:12px; }
.jer:hover{ border-color:var(--text-faint); color:var(--text); }
.jer.on{ background:var(--tc); border-color:var(--tc); color:var(--ti); }
.pname{ font-size:12px; color:var(--text-muted); min-height:17px; }
.pname b{ color:var(--text); }
.tabs3{ display:flex; gap:2px; border-bottom:1px solid var(--border); }
.tabs3 button{ padding:5px 10px 7px; font-family:var(--display); font-weight:600; font-size:12.5px; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; display:inline-flex; gap:5px; align-items:center; }
.tabs3 button.on{ color:var(--text); border-bottom-color:var(--ember); }
.tabs3 button i{ font-style:normal; font-size:10.5px; background:var(--ember); color:#fff; border-radius:100px; padding:0 5px; }
.court-wrap{ position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:var(--court); }
.court{ display:block; width:100%; height:auto; cursor:crosshair; touch-action:manipulation; }
.court .ln{ fill:none; stroke:var(--court-line); stroke-width:.6; }
.court .paint{ fill:var(--court-paint); } .court .floor{ fill:var(--court); }
.court .ghost{ fill:none; stroke:var(--ember); stroke-width:.5; stroke-dasharray:1.4 1.2; opacity:0; pointer-events:none; }
.court .pin{ animation:pin .45s var(--ease); transform-box:fill-box; transform-origin:center; }
@keyframes pin{ from{ transform:scale(2.4); opacity:0; } }
.shotinfo{ font-size:12px; color:var(--text-muted); display:flex; gap:8px; align-items:center; }
.shotinfo b{ color:var(--text); }
.hint{ font-size:11.5px; color:var(--text-faint); }
.ifoot{ position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:6px; }

/* ------------------------------------------------------------------ Edit: the footage as one track, cut like CapCut
   S.edl lists the parts of the original film that are kept, in order: [{id, a, b}] in the film's own seconds.
   Splitting adds a boundary, deleting removes a part and the parts after it close up (the timeline shows the
   edited game). Playback plays the edit; "Save edited game" writes it out. The original file is never changed,
   and tagged plays keep the original film's times, so they survive any edit. */
const segLen = s => s.b - s.a;
function segs(){ return S.edl && S.edl.length ? S.edl : [{id:'all', a:0, b:duration()}]; }
function isEdited(){ const D0 = duration(); return !!(S.edl && S.edl.length && (S.edl.length > 1 || S.edl[0].a > .05 || S.edl[0].b < D0 - .05)); }

function srcToSeq(t){ let off = 0; for (const s of segs()){ if (t < s.a) return off; if (t <= s.b) return off + t - s.a; off += segLen(s); } return off; }
function seqToSrc(x){ let off = 0; const ss = segs(); for (const s of ss){ const L = segLen(s); if (x < off + L) return s.a + Math.max(0, x - off); off += L; } return ss.length ? ss[ss.length - 1].b : 0; }
function segOff(seg){ let off = 0; for (const s of segs()){ if (s.id === seg.id) return off; off += segLen(s); } return off; }
function segAt(t){ return segs().find(s => t >= s.a - 1e-3 && t < s.b - 1e-3) || null; }
function seqSpan(t0, t1){ let lo = null, hi = null, off = 0; for (const s of segs()){ const a = Math.max(t0, s.a), b = Math.min(t1, s.b); if (b > a){ if (lo == null) lo = off + a - s.a; hi = off + b - s.a; } off += segLen(s); } return lo == null ? null : [lo, hi]; }
const curSeq = () => srcToSeq(now());
function seekSeq(x){ seek(seqToSrc(clamp(x, 0, seqDur()))); }
const removedTotal = () => isEdited() ? Math.max(0, duration() - seqDur()) : 0;
function keepRanges(){ const D0 = duration(); return segs().map(s => [s.a, Math.min(s.b, D0)]).filter(([a, b]) => b - a > .05); }
function editPoints(){ const out = [0]; let off = 0; segs().forEach(s => { off += segLen(s); out.push(off); }); return out; }

function editOp(fn, msg){
  if (!hasVideo) return toast(T('Open the replay first'));
  if (!S.edl || !S.edl.length) S.edl = [{id:uid(), a:0, b:duration()}];
  const before = snap();
  if (fn() === false) return;
  HIST.push(before); if (HIST.length > 60) HIST.shift(); FUT.length = 0;
  S.edl = S.edl.filter(s => segLen(s) > .04);
  if (U.selSeg && !S.edl.some(s => s.id === U.selSeg)) U.selSeg = null;
  save(); renderTL(); renderInsp();
  if (msg) toast(msg, {label:T('Undo'), fn:undo});
}
function splitAt(t){

    S.edl.splice(S.edl.indexOf(s), 1, {id:s.id, a:s.a, b:t}, {id:uid(), a:t, b:s.b});

function partUnderPlayhead(){ const t = now(); return (U.selSeg && segs().find(s => s.id === U.selSeg && t >= s.a - 1e-3 && t <= s.b + 1e-3)) || segAt(t); }
function deleteLeft(){
  const t = now();
  editOp(() => { const s = partUnderPlayhead(); if (!s || t - s.a < .05) return false; const cut = t - s.a; s.a = t; U.cutMsg = cut; }, T('Deleted {0} on the left', fmt(U.cutMsg || 0, 1)));

function deleteRight(){

async function recordRange(t0, t1, base, onProgress){
  if (!hasVideo) return toast(T('Open the replay first'));
  if (!vid.captureStream && !vid.mozCaptureStream) return toast(T('This browser cannot record clips. Use the ffmpeg commands in Export.'));
  const dl = await getDownloads();
  if (!dl) return toast(T('Saving files is not available in this view. Use the ffmpeg commands in Export.'));
  stopReel(); vid.pause(); vid.currentTime = t0;
  await new Promise(r => vid.addEventListener('seeked', r, {once:true}));
  let stream; try { stream = (vid.captureStream || vid.mozCaptureStream).call(vid); } catch(e) { return toast(T('This video cannot be recorded (it comes from another site).')); }
  const mime = ['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) return toast(T('This browser cannot record clips.'));
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:10e6}), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);

  await new Promise(r => { const f = () => { if (onProgress) onProgress((vid.currentTime - t0) / (t1 - t0)); if (vid.currentTime >= t1 || vid.paused || vid.ended){ r(); } else requestAnimationFrame(f); }; f(); });
  vid.pause(); rec.stop(); await done; $('#hud-rec').hidden = true;
  const name = base + '.' + ext;

  catch(e){ if (e && e.code !== 'declined') toast(T('The clip could not be saved here.')); return false; }
}

/* ------------------------------------------------------------------ simple trim: one stretch of the film, saved as its own video file
   Fast: ffmpeg.wasm (vendor/ffmpeg-0.12, served by HoopStatsMY next to this page) copies the stream without
   re-encoding, reading the film straight from the disk (WORKERFS), so the original picture and sound are kept
   and a minute takes seconds. The cut starts at the keyframe just before the start. Without it (the claude.ai
   copy, a page opened from disk, a film from a link) the browser plays the stretch through once and records it. */
const FF_BASE = (() => { try { return new URL('vendor/ffmpeg-0.12/', location.href).href; } catch(e) { return ''; } })();
const ffPossible = () => !!CUR_FILE && /^https?:$/.test(location.protocol) && !(window.claude && window.claude.use) && typeof WebAssembly === 'object';
let FF = null, FF_LOAD = null;
function loadScript(src){ return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
function getFF(){
  if (FF) return Promise.resolve(FF);
  return FF_LOAD || (FF_LOAD = (async () => {
    if (!window.FFmpegWASM) await loadScript(FF_BASE + 'ffmpeg.js');
    const ff = new window.FFmpegWASM.FFmpeg();
    await ff.load({coreURL:FF_BASE + 'ffmpeg-core.js', wasmURL:FF_BASE + 'ffmpeg-core.wasm'});
    return (FF = ff);
  })().catch(e => { FF_LOAD = null; throw e; }));
}
async function ffTrim(file, t0, t1, onProgress){
  const ff = await getFF();
  const ext = ((file.name.match(/\.([A-Za-z0-9]+)$/) || [, 'mp4'])[1]).toLowerCase();
  const outExt = ext === 'webm' || ext === 'mkv' ? ext : 'mp4';
  const out = 'trim.' + outExt, dur = t1 - t0;
  const onLog = ({message}) => { const m = /time=(\d+):(\d+):([\d.]+)/.exec(message || ''); if (m && onProgress) onProgress(Math.min(1, (+m[1] * 3600 + +m[2] * 60 + +m[3]) / dur)); };
  try { await ff.createDir('/in'); } catch(e) {}
  await ff.mount('WORKERFS', {files:[file]}, '/in');
  ff.on('log', onLog);
  try {
    const rc = await ff.exec(['-ss', t0.toFixed(3), '-i', '/in/' + file.name, '-t', dur.toFixed(3), '-c', 'copy', '-avoid_negative_ts', 'make_zero', out]);
    const data = await ff.readFile(out);
    try { await ff.deleteFile(out); } catch(e) {}
    if (rc !== 0 || !data || !data.length) throw new Error('ffmpeg ' + rc);
    return new Blob([data.buffer], {type:outExt === 'mp4' ? 'video/mp4' : 'video/' + outExt});
  } finally {
    ff.off('log', onLog);
    try { await ff.unmount('/in'); } catch(e) {}
  }
}

/* ------------------------------------------------------------------ downloads capability */
let dlNS;
async function getDownloads(){
  if (dlNS !== undefined) return dlNS;
  try { if (window.claude && window.claude.use){ const d = await window.claude.use('downloads'); if (d) return (dlNS = d); } } catch(e) {}
  return (dlNS = { async save({filename, data}){
    const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
    const a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return {status:'saved'};
  } });
}
async function saveFile(filename, data){
  const dl = await getDownloads();
  if (!dl){ toast(T('Saving files is not available in this view. Use Copy instead.')); return false; }
  try { await dl.save({filename, data}); toast(T('Saved {0}', filename)); return true; }
  catch(e){ if (e && e.code === 'declined') return false; toast(T('That file could not be saved here.')); return false; }
}

function ffmpeg(exact){

      : `ffmpeg -y -ss ${c.t0.toFixed(2)} -i "${src}" -t ${(c.t1 - c.t0).toFixed(2)} -c copy -avoid_negative_ts make_zero "clips/${out}"`;

/* ------------------------------------------------------------------ save the game without the removed stretches */
function editedBase(){ return slug((S.video || 'game').replace(/\.[^.]+$/, '')) + '_edited'; }
function ffmpegEdited(){
  const src = S.video || 'game.mp4', ext = ((src.match(/\.([A-Za-z0-9]+)$/) || [, 'mp4'])[1]).toLowerCase(), k = keepRanges();
  const parts = k.map(([a, b], i) => `ffmpeg -y -ss ${a.toFixed(2)} -i "${src}" -t ${(b - a).toFixed(2)} -c copy -avoid_negative_ts make_zero "keep_${String(i + 1).padStart(3, '0')}.${ext}"`);
  return ['# ' + T('{0} without the removed stretches: {1} parts kept', src, k.length), '# ' + T('Run in the folder that holds the video.'),
    ...parts, '(' + k.map((_, i) => `echo "file 'keep_${String(i + 1).padStart(3, '0')}.${ext}'"`).join('; ') + ') > keep_list.txt',
    `ffmpeg -y -f concat -safe 0 -i keep_list.txt -c copy "${editedBase()}.${ext}"`].join('\n');
}
// fast: every kept stretch is copied without re-encoding, then joined; a long game is saved in parts so the browser's memory holds
async function ffEdited(file, keeps, onProgress, onMsg){
  const ff = await getFF();
  const ext0 = ((file.name.match(/\.([A-Za-z0-9]+)$/) || [, 'mp4'])[1]).toLowerCase(), ext = ext0 === 'webm' || ext0 === 'mkv' ? ext0 : 'mp4';
  const bps = file.size / (vid.duration || 1), maxSec = Math.max(60, 550e6 / bps);
  const groups = [[]]; let acc = 0;
  keeps.forEach(([a, b]) => { while (b - a > .05){ const room = maxSec - acc, d = Math.min(b - a, room); groups[groups.length - 1].push([a, a + d]); acc += d; a += d; if (acc >= maxSec - .05){ groups.push([]); acc = 0; } } });
  const gs = groups.filter(g => g.length), total = keeps.reduce((s, [a, b]) => s + b - a, 0);
  let done = 0, cur = 0;
  const onLog = ({message}) => { const m = /time=(\d+):(\d+):([\d.]+)/.exec(message || ''); if (m && cur) onProgress(Math.min(1, (done + Math.min(cur, +m[1] * 3600 + +m[2] * 60 + +m[3])) / total)); };
  try { await ff.createDir('/in'); } catch(e) {}
  await ff.mount('WORKERFS', {files:[file]}, '/in');
  ff.on('log', onLog);
  const saved = [];
  try {
    for (let gi = 0; gi < gs.length; gi++){
      const names = [];
      onMsg(gs.length > 1 ? T('Cutting part {0} of {1}…', gi + 1, gs.length) : T('Cutting…'));
      for (let j = 0; j < gs[gi].length; j++){
        const [a, b] = gs[gi][j], n = `k${j}.${ext}`; cur = b - a;
        const rc = await ff.exec(['-ss', a.toFixed(3), '-i', '/in/' + file.name, '-t', (b - a).toFixed(3), '-c', 'copy', '-avoid_negative_ts', 'make_zero', n]);
        if (rc !== 0) throw new Error('ffmpeg ' + rc);
        names.push(n); done += b - a; cur = 0; onProgress(done / total);
      }
      let out = names[0];
      if (names.length > 1){
        await ff.writeFile('list.txt', names.map(n => `file '${n}'`).join('\n'));
        out = 'out.' + ext;
        const rc = await ff.exec(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', out]);
        if (rc !== 0) throw new Error('concat ' + rc);
      }
      const data = await ff.readFile(out);
      for (const n of new Set([...names, out, 'list.txt'])){ try { await ff.deleteFile(n); } catch(e) {} }
      if (!data || !data.length) throw new Error('empty');
      const fname = editedBase() + (gs.length > 1 ? `_part${gi + 1}of${gs.length}` : '') + '.' + ext;
      await saveFile(fname, new Blob([data.buffer], {type:ext === 'mp4' ? 'video/mp4' : 'video/' + ext}));
      saved.push(fname);
    }
  } finally {
    ff.off('log', onLog);
    try { await ff.unmount('/in'); } catch(e) {}
  }
  return saved;
}
// fallback: play the kept stretches once and record them, pausing the recorder over every removed one

  const dl = await getDownloads(); if (!dl) return false;
  let stream; try { stream = (vid.captureStream || vid.mozCaptureStream).call(vid); } catch(e) { toast(T('This video cannot be recorded (it comes from another site).')); return false; }
  const mime = ['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) return false;
  stopReel(); vid.pause(); U.recording = true;
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:10e6}), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const total = keeps.reduce((s, [a, b]) => s + b - a, 0); let before = 0;
  $('#hud-rec').hidden = false;
  try {
    for (let i = 0; i < keeps.length; i++){
      const [a, b] = keeps[i];
      vid.currentTime = a; await new Promise(r => vid.addEventListener('seeked', r, {once:true}));
      if (rec.state === 'inactive') rec.start(250); else rec.resume();
      await vid.play();
      await new Promise(r => { const f = () => { onProgress((before + Math.max(0, vid.currentTime - a)) / total); if (vid.currentTime >= b || vid.ended || U.recStop) r(); else requestAnimationFrame(f); }; f(); });
      vid.pause(); if (rec.state === 'recording') rec.pause(); before += b - a;
      if (U.recStop) break;
    }
  } finally { if (rec.state !== 'inactive') rec.stop(); await done; $('#hud-rec').hidden = true; U.recording = false; U.recStop = false; }
  const name = base + '.' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm');
  try { await dl.save({filename:name, data:new Blob(parts, {type:mime})}); return name; } catch(e) { return false; }
}

  const k = e.key, lk = k.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && lk === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === '=' || k === '+')){ e.preventDefault(); zoomTo(TL.pps * 1.6, curSeq()); return; }
  if (mod && (k === '-' || k === '_')){ e.preventDefault(); zoomTo(TL.pps / 1.6, curSeq()); return; }
  if (e.shiftKey && lk === 'z' && !mod){ e.preventDefault(); zoomFit(); return; }
  if (U.ws === 'cut' && !e.altKey){
    if (mod && lk === 'b'){ e.preventDefault(); splitAt(now()); return; }
    if (mod) return;
    const cm = {q:deleteLeft, w:deleteRight, delete:deleteSelected, backspace:deleteSelected, a:() => setTool('sel'), b:() => setTool(U.tool === 'blade' ? 'sel' : 'blade'),
      arrowup:() => jumpEdit(-1), arrowdown:() => jumpEdit(1), s:() => splitAt(now())};
    if (cm[lk]){ e.preventDefault(); cm[lk](); return; }
  }
  if (mod && lk === 'y'){ e.preventDefault(); redo(); return; }
  if (mod || e.altKey || U.ws === 'rep') return;
  const map = {
    ' ': togglePlay, k: togglePlay, j: () => seek(now() - 5), l: () => seek(now() + 5),
    arrowleft: () => step(e.shiftKey ? -1 : -1 / 30), arrowright: () => step(e.shiftKey ? 1 : 1 / 30), arrowup: () => jumpClip(-1), arrowdown: () => jumpClip(1),
    i: markIn, o: markOut, enter: () => U.ws === 'edit' && saveClip(), s: splitAtPlayhead, t: openTrim, f: () => toggleFS($('#viewer')),
    delete: () => U.sel && deleteClip(U.sel), backspace: () => U.sel && deleteClip(U.sel),
    h: () => { U.team = 'home'; U.player = null; renderInsp(); }, a: () => { U.team = 'away'; U.player = null; renderInsp(); },
    '+': () => zoomTo(TL.pps * 1.6, curSeq()), '=': () => zoomTo(TL.pps * 1.6, curSeq()), '-': () => zoomTo(TL.pps / 1.6, curSeq()), '\\': zoomFit,
    ',': () => setSpeed(.5), '.': () => setSpeed(1), '/': () => setSpeed(2), '?': openKeys,
  };
  if (/^[1-9]$/.test(k)){ const r = RES[+k - 1]; U.res = U.res === r.k ? null : r.k; if (!['M2', 'M3'].includes(U.res)) U.and1 = false; renderInsp(); showCourt(); e.preventDefault(); return; }
  if (map[lk]){ e.preventDefault(); map[lk](); }
});

if (!VIEW && !S.clips.length) U.ws = 'cut';
function renderAll(){ renderHead(); if (U.ws === 'rep') renderReport(); renderBin(); renderInsp(); renderTL(); }
applyStatic();
renderAll();
requestAnimationFrame(() => { TL.pps = 0; renderTL(); });
if (VIEW) viewInit();
else if (HOST){
  if (S.mid && hostGame(S.mid)){ const hg = hostGame(S.mid); ['home', 'away'].forEach(k => { const t = hostTeam(S.teams[k].name, hg.c.id); Object.assign(S.teams[k], {logo:t.logo, plate:t.plate, flag:t.flag}); }); renderAll(); }
  const q = QS.get('mid');
  if (q && q !== S.mid) linkGame(q);
  else if (!S.mid) setTimeout(openPicker, 300);
  loadIndex();
}
})();
</script>
